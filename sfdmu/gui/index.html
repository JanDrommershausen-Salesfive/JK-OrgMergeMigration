<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFDMU Migration</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#667085; --line:#e2e5ea; --accent:#0b5fff; --danger:#c62828; --logbg:#0f1720; --logtext:#d5dde8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1a2029; --text:#e6eaf0; --muted:#8c97a7; --line:#2b3340; --accent:#5b9bff; --danger:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  select, input[type=text] { width:100%; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
  .info { color:var(--muted); font-size:13px; margin-top:8px; }
  .modes { display:flex; gap:20px; margin:16px 0 8px; flex-wrap:wrap; }
  .modes label { font-weight:400; display:flex; gap:6px; align-items:center; margin:0; }
  .live-box { display:none; margin-top:12px; padding:12px; border:1px solid var(--danger); border-radius:6px; }
  .live-box.on { display:block; }
  .live-box strong { color:var(--danger); }
  .row { display:flex; gap:10px; margin-top:16px; }
  button { font:inherit; padding:9px 18px; border-radius:6px; border:0; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button.danger { background:var(--danger); }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  pre { margin:0; background:var(--logbg); color:var(--logtext); padding:14px; border-radius:8px; height:380px; overflow:auto; font:12.5px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<main>
  <h1>SFDMU Migration</h1>
  <p class="sub">US PROD → EU CDEV5 · immer genau ein Objekt pro Lauf</p>

  <div class="card">
    <label for="obj">Objekt</label>
    <select id="obj"></select>
    <div class="info" id="objinfo"></div>

    <div class="modes">
      <label><input type="radio" name="mode" value="simulation" checked> Simulation (schreibt nichts)</label>
      <label><input type="radio" name="mode" value="live"> Live (schreibt nach <span class="alias"></span>)</label>
    </div>
    <div class="live-box" id="livebox">
      <strong>Live-Lauf:</strong> Daten werden in <span class="alias"></span> geschrieben.
      Zur Bestätigung den Alias eingeben:
      <input type="text" id="confirm" autocomplete="off" style="margin-top:8px">
    </div>

    <div class="row">
      <button id="run">Starten</button>
      <button id="stop" class="secondary" disabled>Abbrechen</button>
    </div>
  </div>

  <pre id="log">Noch kein Lauf gestartet.</pre>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = { objects: [], targetAlias: '' };

const mode = () => document.querySelector('input[name=mode]:checked').value;

function renderInfo() {
  const o = state.objects.find((x) => x.folder === $('obj').value);
  if (!o) return;
  const parents = o.readonlyParents.length ? o.readonlyParents.join(', ') : 'keine';
  $('objinfo').textContent = `Operation: ${o.operation} · External ID: ${o.externalId || 'keine (Insert, Duplikate bei Wiederholung)'} · Readonly-Parents: ${parents}`;
}

function updateButtons(running = false) {
  const liveOk = mode() !== 'live' || $('confirm').value === state.targetAlias;
  $('run').disabled = running || !liveOk;
  $('run').className = mode() === 'live' ? 'danger' : '';
  $('stop').disabled = !running;
  $('livebox').classList.toggle('on', mode() === 'live');
}

async function load() {
  const r = await (await fetch('/api/objects')).json();
  state = r;
  document.querySelectorAll('.alias').forEach((e) => (e.textContent = r.targetAlias));
  $('obj').innerHTML = r.objects.map((o) => `<option value="${o.folder}">${o.folder}</option>`).join('');
  renderInfo();
  updateButtons(r.running);
}

async function run() {
  updateButtons(true);
  const log = $('log');
  log.textContent = '';
  const res = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folder: $('obj').value, mode: mode(), confirm: $('confirm').value })
  });
  if (!res.ok) { log.textContent = await res.text(); updateButtons(false); return; }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    log.textContent += dec.decode(value);
    log.scrollTop = log.scrollHeight;
  }
  $('confirm').value = '';
  updateButtons(false);
}

$('obj').onchange = renderInfo;
document.querySelectorAll('input[name=mode]').forEach((e) => (e.onchange = () => updateButtons()));
$('confirm').oninput = () => updateButtons();
$('run').onclick = run;
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
load();
</script>
</body>
</html>
